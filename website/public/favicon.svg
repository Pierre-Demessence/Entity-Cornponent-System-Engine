  <rect x="6" y="6" width="20" height="20" rx="4" fill="#3369ff"/>
  <rect x="9" y="14" width="4" height="4" rx="1" fill="#0b0b0f"/>
  <rect x="14" y="14" width="4" height="4" rx="1" fill="#0b0b0f"/>
  <rect x="19" y="14" width="4" height="4" rx="1" fill="#0b0b0f"/>
</svg>
